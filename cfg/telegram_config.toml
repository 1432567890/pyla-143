# Telegram bot support for Pyla 143.
# Create a bot with @BotFather, paste the token below, set admin_ids, then set enabled = true.
# Pyla 143 is a fork of PylaAI, based on Pyla XXZ.

enabled = false
bot_token = ""
admin_ids = []

send_match_summary = true
include_screenshot = true

remote_control_enabled = true
poll_timeout_seconds = 25
heartbeat_enabled = true
heartbeat_interval_sec = 300
notify_on_start = true
notify_on_stop = true
notify_on_error = true
notify_on_brawler_change = true
notify_on_config_reload = true
notify_on_trophy_update = true
